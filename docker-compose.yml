services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "docker-dev-secret"
      DATABASE_URL: "postgresql://fuel:fuel@postgres:5432/fuel"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuel
      POSTGRES_USER: fuel
      POSTGRES_PASSWORD: fuel
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
volumes:
  postgres_data:
